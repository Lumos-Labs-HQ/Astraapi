version: "3"

vars:
  GO: go1.27rc2
  UV: uv
  ASTRA_PORT: 8001
  FAST_PORT: 8002
  DURATION: 10s
  CONNS: 64
  BUILD_DIR: cpp_core/build
  CPP_SRC:
    sh: find cpp_core/src cpp_core/include -name '*.cpp' -o -name '*.hpp' | tr '\n' ' '

tasks:
  build:
    desc: Build C++ core extension
    cmds:
      - bash scripts/build_core.sh

  fmt:
    desc: Format all C++ source files with clang-format
    cmds:
      - clang-format -i {{.CPP_SRC}}
      - echo "[task] Formatted all C++ files"

  fmt:check:
    desc: Check C++ formatting without modifying files
    cmds:
      - clang-format --dry-run --Werror {{.CPP_SRC}}

  lint:
    desc: Run clang-tidy linting on C++ core
    cmds:
      - task: build
      - clang-tidy {{.CPP_SRC}} -p {{.BUILD_DIR}} --fix --fix-errors
      - echo "[task] Lint complete"

  lint:check:
    desc: Run clang-tidy without fixing
    cmds:
      - task: build
      - clang-tidy {{.CPP_SRC}} -p {{.BUILD_DIR}}

  fix:
    desc: Format + lint fix all C++ files
    cmds:
      - task: fmt
      - task: lint
      - echo "[task] All fixes applied"

  test:
    desc: Run full test suite
    cmds:
      - "{{.UV}} run pytest tests/ -q"

  run-astra:
    desc: Start AstraAPI server (1 worker, CPU 0)
    cmds:
      - taskset -c 0 {{.UV}} run python bench/servers/astraapi_server.py

  run-fast:
    desc: Start FastAPI+Uvicorn server (1 worker, CPU 1)
    cmds:
      - taskset -c 1 {{.UV}} run uvicorn bench.servers.fastapi_server:app --host 127.0.0.1 --port {{.FAST_PORT}} --workers 1 --log-level error

  stop:
    desc: Stop all benchmark servers
    cmds:
      - pkill -f "astraapi_server.py" || true
      - pkill -f "fastapi_server:app" || true

  bench-astra:
    desc: Benchmark AstraAPI (all workloads)
    cmds:
      - cd bench && {{.GO}} run . -target astra -d {{.DURATION}} -c {{.CONNS}}

  bench-fast:
    desc: Benchmark FastAPI (all workloads)
    cmds:
      - cd bench && {{.GO}} run . -target fast -d {{.DURATION}} -c {{.CONNS}}

  bench:
    desc: Benchmark both AstraAPI and FastAPI (comparison)
    cmds:
      - cd bench && {{.GO}} run . -target both -d {{.DURATION}} -c {{.CONNS}}

  clean:
    desc: Remove C++ build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - echo "[task] Cleaned"
